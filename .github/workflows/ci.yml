name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Init databases
        run: python scripts/init_db.py

      - name: Seed fake data
        run: python scripts/seed_data.py

      - name: Boot check
        run: python run.py

      - name: CLI smoke test
        run: |
          python scripts/os_cli.py add-task "CI test task" "CI"
          python scripts/morning_brief.py

      - name: Agent wiring check (data only, no LLM)
        run: python scripts/orchestrator.py "list backend tickets"
