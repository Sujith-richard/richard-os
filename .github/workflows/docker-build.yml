name: Docker Image Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t richard-os:latest .
      - name: Tag
        run: docker tag richard-os:latest ghcr.io/sujith-richard/richard-os:latest
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: sujith-richard
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: docker push ghcr.io/sujith-richard/richard-os:latest
