# Richard OS — company config
name: Richard OS
owner: Sujith Richard
version: 0.1.0

agents:
  job_hunter:
    role: "Screens job boards, matches roles to skills, drafts applications"
    autonomy: 2
    schedule: "09:00 daily"
    model: "gemini-3.5-flash"
  content_ops:
    role: "Drafts LinkedIn/X posts from your work"
    autonomy: 2
    schedule: "mon,wed,fri 18:00"
    model: "qwen3-32b"
  freelance_biz:
    role: "Follows leads, tracks income/expenses, drafts invoices"
    autonomy: 2
    schedule: "12:00 daily"
    model: "deepseek-v4-flash-free"
  pm_assistant:
    role: "Breaks goals into tasks, flags blockers"
    autonomy: 3
    schedule: "08:00 daily"
    model: "gemini-3.5-flash"
  portfolio_builder:
    role: "Tracks GitHub metrics, suggests portfolio improvements"
    autonomy: 1
    schedule: "weekly"
    model: "qwen3-32b"

systems_of_record:
  - second_brain
  - pm
  - finance
  - crm
  - creator
