        project_structures:
        - nmap
        - burp
      defense:
        knowledge:
        - soc
        - detection
        - response
        skills:
        - threat-hunt
        - incident
        agents:
        - soc-analyst
        project_structures:
        - siem
        - blue-team
  cloud:
