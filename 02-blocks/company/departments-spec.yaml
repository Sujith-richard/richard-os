  ai:
    lead: ai-lead
    title: AI Engineering
    icon: 🤖
    stacks:
    - python
    - pytorch
    - tensorflow
    - transformers
    - langchain
    - openai
    - huggingface
    specialists:
    - ml-engineer
    - llm-engineer
    - rag-engineer
    - fine-tuner
    - eval-engineer
    - prompt-engineer
    skills:
    - model-train
    - llm-prompt
    - rag-pipeline
    - fine-tune
    - eval-harness
    - prompt-design
    autonomy: 3
    decision_rules:
    - choose model by task cost/latency/quality tradeoff
    - every LLM feature ships with an eval set
    - no fine-tune without baseline eval comparison
    workflows:
    - 'llm-feature: prompt -> eval -> deploy -> monitor'
    - 'fine-tune: data -> prep -> train -> eval -> ship'
    datasets:
    - eval-prompts.json
    - training-samples.json
    sub_departments:
      ml:
        knowledge:
        - pytorch
        - tensorflow
        - scikit-learn
        skills:
        - model-train
        - eval
        - tuning
        agents:
        - ml-engineer
        - eval-engineer
        project_structures:
        - pytorch
        - tf
      llm:
        knowledge:
        - transformers
        - langchain
        - rag
        skills:
        - prompt
        - rag
        - fine-tune
        agents:
        - llm-engineer
        - rag-engineer
        project_structures:
        - langchain
        - rag
      vision:
        knowledge:
        - cnn
        - detection
        - segmentation
        skills:
        - image-models
        - augmentation
        agents:
        - cv-engineer
        project_structures:
        - yolo
        - resnet
  data:
    lead: data-lead
    title: Data & Analytics
    icon: 📊
    stacks:
    - python
    - sql
    - pandas
    - dbt
    - airflow
    - postgres
    - mongodb
    - bigquery
    specialists:
    - data-engineer
    - analyst
    - bi-dev
    - pipeline-eng
    - quality-eng
    skills:
    - sql-model
    - etl-pipeline
    - dashboard-build
    - data-quality
    - metric-design
    autonomy: 3
    decision_rules:
    - every metric defined once in a shared dictionary
    - pipelines idempotent and re-runnable
    - PII columns never leave the data layer
    workflows:
    - 'etl: extract -> transform -> load -> validate'
    - 'report: query -> chart -> annotate -> share'
    datasets:
    - sample-metrics.json
    - pii-registry.json
    sub_departments:
      engineering:
        knowledge:
        - pandas
        - spark
        - airflow
        skills:
        - etl
        - pipelines
        - quality
        agents:
        - data-engineer
        project_structures:
        - airflow
        - dbt
      analytics:
        knowledge:
        - sql
        - bi
        - dashboards
        skills:
        - metrics
        - reporting
        agents:
        - analyst
        - bi-dev
        project_structures:
        - metabase
        - superset
  cyber:
    lead: cyber-lead
    title: Cybersecurity
    icon: 🛡️
    stacks:
    - python
    - burp
    - nmap
    - zap
    - kali
    - aws-security
    - terraform
    specialists:
    - pentester
    - soc-analyst
    - appsec-eng
    - compliance-eng
    - threat-intel
    skills:
    - pentest-scan
    - vuln-triage
    - appsec-review
    - compliance-check
    - threat-hunt
    autonomy: 2
    decision_rules:
    - critical findings block delivery until fixed
    - no pentest against targets without written scope
    - secrets never in code, always in vault
    workflows:
    - 'pentest: scope -> recon -> exploit -> report -> fix'
    - 'incident: detect -> contain -> eradicate -> recover -> postmortem'
    datasets:
    - cve-watchlist.json
    - scope-template.json
    sub_departments:
      offense:
        knowledge:
        - pentest
        - exploit
        - recon
        skills:
        - pentest
        - vuln-scan
        agents:
