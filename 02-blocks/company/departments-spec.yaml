departments:
  web:
    lead: web-lead
    title: Web Development
    icon: 🌐
    stacks:
    - react
    - vue
    - nextjs
    - fastapi
    - django
    - node
    - tailwind
    - typescript
    specialists:
    - frontend-lead
    - backend-lead
    - db-designer
    - api-builder
    - auth-impl
    - devops-eng
    - testing-eng
    - security-eng
    - docs-writer
    skills:
    - frontend-scaffold
    - backend-scaffold
    - db-schema
    - api-design
    - auth-impl
    - devops-setup
    - testing
    - security-scan
    - docs-write
    autonomy: 3
    decision_rules:
    - route briefs by stack keywords to frontend/backend/fullstack
    - review-fix loop max 3 iterations, escalate after
    - security blocks delivery on hardcoded secrets
    - quality gate requires >= 80% structure completeness
    workflows:
    - 'project-generation: brief -> route -> scaffold -> review -> secure -> qualify
      -> package -> deliver -> learn'
    - 'code-review: pr -> lint -> test -> approve/reject'
    datasets:
    - starter-components.json
    - api-blueprints.json
    sub_departments:
      frontend:
        knowledge:
        - HTML
        - CSS
        - JavaScript
        - TypeScript
        - React
        - Vue
        - Next.js
        skills:
        - component-design
        - state-management
        - routing
        - responsive
        - accessibility
        - performance
        - seo
        agents:
        - react-expert
        - nextjs-expert
        - vue-expert
        - css-expert
        - accessibility-agent
        - performance-agent
        project_structures:
        - react
        - nextjs
        - vue
        - vite
        - custom
      backend:
        knowledge:
        - Express
        - FastAPI
        - Django
        - Spring Boot
        - Laravel
        - NestJS
        skills:
        - api-design
        - authentication
        - authorization
        - database-design
        - security
        - performance
        - logging
        - caching
        agents:
        - express-expert
        - fastapi-expert
        - database-architect
        - api-designer
        - security-reviewer
        - performance-optimizer
        project_structures:
        - express
        - fastapi
        - django
        - nestjs
      database:
        knowledge:
