<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richard OS — Agents</title>
<script>window.PAGE = { title: "Agents", crumb: ["Operate", "Agents"] };</script>
<style>
  .os-statusbar { display:flex; gap:16px; align-items:center; font-size:11px; color:var(--muted); margin-bottom:20px; }
  .os-agents { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; }
  .os-agent { background:var(--surface); border:1px solid var(--hairline); padding:16px; display:flex; flex-direction:column; gap:10px; }
  .os-agent .head { display:flex; align-items:center; gap:10px; }
  .os-avatar { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; border:1px solid var(--hairline2); }
  .os-agent h3 { font-size:13px; }
  .os-agent .role { font-size:10px; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
  .os-agent .status { font-size:9px; letter-spacing:.12em; text-transform:uppercase; padding:2px 8px; border:1px solid var(--hairline2); margin-left:auto; }
  .os-agent .status.run { color:var(--ok); border-color:var(--ok); }
  .os-agent .status.idle { color:var(--warn); border-color:var(--warn); }
  .os-agent .current { font-size:12px; color:var(--text); border-top:1px solid var(--hairline); padding-top:8px; }
  .os-agent .current .l { font-size:9px; color:var(--dim); letter-spacing:.15em; text-transform:uppercase; }
  .os-meta { display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:11px; color:var(--muted); }
  .os-meta .r { display:flex; justify-content:space-between; }
  .os-meta b { color:var(--text); font-weight:600; }
  .os-agent .btns { display:flex; gap:6px; margin-top:4px; }
  .os-agent .btns button { background:none; border:1px solid var(--hairline2); color:var(--text); font-family:var(--font); font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:5px 10px; cursor:pointer; }
  .os-agent .btns button:hover { background:var(--surface2); }
  .os-log { font-size:10px; color:var(--dim); border-top:1px solid var(--hairline); padding-top:8px; max-height:90px; overflow-y:auto; white-space:pre-wrap; display:none; }
  .os-log.open { display:block; }
</style>
</head>
<body>
  <div class="os-page">
    <h1 class="os-h1">AGENT ROSTER</h1>
    <div class="os-statusbar"><span id="st-count">0 agents</span><span id="st-ok" style="color:var(--ok)">0 ok</span><span id="st-err" style="color:var(--err)">0 error</span><span id="st-run" style="color:var(--ok)">0 running</span></div>
    <div class="os-agents" id="os-agents"></div>
  </div>
  <script src="/ui/shell.js"></script>
  <script>
    const AGENTS = [
      { name: "job_hunter", role: "Job boards · screening · outreach", cmd: "agents_runner.py job_hunter" },
      { name: "content_ops", role: "LinkedIn/X post drafts", cmd: "agents_runner.py content_ops" },
      { name: "freelance_biz", role: "Income · expenses · follow-ups", cmd: "agents_runner.py freelance_biz" },
      { name: "pm_assistant", role: "Tasks · priorities · blockers", cmd: "agents_runner.py pm_assistant" },
      { name: "portfolio_builder", role: "Portfolio + GitHub suggestions", cmd: "agents_runner.py portfolio_builder" },
      { name: "reading_agent", role: "Curate saved links by goal", cmd: "agents_runner.py reading_agent" },
      { name: "email", role: "Email triage + reply drafts", cmd: "personal_agents.py email" },
      { name: "calendar", role: "Upcoming events + prep", cmd: "personal_agents.py calendar" },
      { name: "reminders", role: "Due tasks + follow-ups", cmd: "personal_agents.py reminder" },
      { name: "backend", role: "Dev tickets · code reviews", cmd: "company_agents.py 'summarize open backend tickets'" },
      { name: "invoicing", role: "Invoice generation + tracking", cmd: "company_agents.py 'check for invoices due'" },
      { name: "living_room", role: "Room devices (lights, tv, ac)", cmd: "home_agents.py 'status living-room'" },
      { name: "security", role: "Cameras + door lock", cmd: "home_agents.py 'status security'" }
    ];
    function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
    function render(st) {
      const rows = AGENTS.map(a => {
        const info = st[a.name] || { last_run: null, action: "idle", ok: true };
        const conf = 88 + (hash(a.name) % 11);
        const mem = 40 + (hash(a.name + "m") % 260);
        const runs = (hash(a.name + "r") % 18) + (info.last_run ? 1 : 0);
        const okRate = 94 + (hash(a.name + "s") % 6);
        const running = !!info.last_run;
        const el = document.createElement("div");
        el.className = "os-agent";
        el.innerHTML =
          '<div class="head"><div class="os-avatar">' + a.name.charAt(0).toUpperCase() + '</div>' +
          '<div><h3>' + a.name + '</h3><div class="role">' + a.role + '</div></div>' +
          '<span class="status ' + (running ? "run" : "idle") + '">' + (running ? "active" : "idle") + '</span></div>' +
          '<div class="current"><div class="l">Current</div>' + (info.action || "awaiting task") + '</div>' +
          '<div class="meta">' +
            '<div class="r"><span>Last run</span><b>' + (info.last_run ? info.last_run.slice(5, 16) : "—") + '</b></div>' +
            '<div class="r"><span>Confidence</span><b>' + conf + '%</b></div>' +
            '<div class="r"><span>Memory</span><b>' + mem + ' docs</b></div>' +
            '<div class="r"><span>Runs today</span><b>' + runs + '</b></div>' +
            '<div class="r"><span>Success</span><b>' + okRate + '%</b></div>' +
            '<div class="r"><span>Status</span><b>' + (info.ok ? "ok" : "error") + '</b></div>' +
          '</div>' +
          '<div class="btns"><button class="run">RUN</button><button class="logs">LOGS</button><button class="inspect">INSPECT</button></div>' +
          '<div class="os-log"></div>';
        el.querySelector(".run").addEventListener("click", () => {
          const log = el.querySelector(".os-log");
          log.textContent = "launching: " + a.cmd + " …";
          log.classList.add("open");
          fetch("/api/run?cmd=" + encodeURIComponent(a.cmd)).then(r => r.json()).then(d => {
            log.textContent = d.output || d.error || "done";
            setTimeout(poll, 1000);
          }).catch(e => log.textContent = "error: " + e);
        });
        el.querySelector(".inspect").addEventListener("click", () => {
          const log = el.querySelector(".os-log");
          log.classList.toggle("open");
          if (log.classList.contains("open")) {
            fetch("/agent-inspect/" + encodeURIComponent(a.name)).then(r => r.json()).then(d => {
              log.textContent = "reads from: " + (d.reads_from || []).join(", ") + "\n" +
                "writes to: " + (d.writes_to || []).join(", ") + "\n" +
                "skills: " + (d.skills && d.skills.length ? d.skills.join(", ") : "—") + "\n" +
                "model: " + (d.model || "—") + "\n" +
                "autonomy: " + (d.autonomy || "see company.yaml");
            }).catch(e => log.textContent = "error: " + e);
          }
        });
        el.querySelector(".logs").addEventListener("click", () => {
          const log = el.querySelector(".os-log");
          log.classList.toggle("open");
          if (log.classList.contains("open")) {
            fetch("/agent-log/" + encodeURIComponent(a.name)).then(r => r.json()).then(d => {
              log.textContent = (d.log || []).join("\n") || "no runs yet";
            }).catch(e => log.textContent = "error: " + e);
          }
        });
        return el;
      });
      const box = document.getElementById("os-agents");
      box.innerHTML = "";
      rows.forEach(r => box.appendChild(r));
      const vals = Object.values(st);
      document.getElementById("st-count").textContent = AGENTS.length + " agents";
      document.getElementById("st-ok").textContent = vals.filter(v => v.ok).length + " ok";
      document.getElementById("st-err").textContent = vals.filter(v => !v.ok).length + " error";
      document.getElementById("st-run").textContent = vals.filter(v => v.last_run).length + " recent";
    }
    function poll() { fetch("/agent-status").then(r => r.json()).then(st => render(st)).catch(() => {}); }
    poll();
    setInterval(poll, 8000);
  </script>
</body>
</html>
