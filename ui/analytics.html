<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richard OS — Analytics</title>
<script>window.PAGE = { title: "Analytics", crumb: ["System", "Analytics"] };</script>
<style>
  .os-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .os-kpi { background:var(--surface); border:1px solid var(--hairline); padding:14px; }
  .os-kpi .v { font-size:20px; font-weight:700; }
  .os-kpi .l { font-size:9px; letter-spacing:.15em; text-transform:uppercase; color:var(--dim); margin-top:3px; }
  .os-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(340px,1fr)); gap:16px; margin-bottom:20px; }
  .os-card { background:var(--surface); border:1px solid var(--hairline); padding:16px; display:flex; flex-direction:column; min-width:0; }
  .os-card h3 { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
  .os-bar { display:flex; align-items:flex-end; gap:3px; height:140px; }
  .os-bar .b { flex:1; background:var(--core); opacity:.8; min-width:2px; }
  .os-line { position:relative; height:140px; border-bottom:1px solid var(--hairline); }
  .os-line svg { width:100%; height:100%; display:block; }
  .os-heat { display:grid; grid-template-columns:repeat(12,1fr); gap:3px; }
  .os-heat .cell { aspect-ratio:1; background:var(--surface2); border:1px solid var(--hairline); }
  .os-heat .cell.h { background:var(--core); opacity:.9; }
  .os-heat .cell.m { background:var(--tool); opacity:.6; }
  .os-heat .cell.l { background:var(--surface2); }
  .os-legend { display:flex; gap:12px; font-size:10px; color:var(--muted); margin-top:8px; }
  .os-legend .sw { width:10px; height:10px; display:inline-block; }
  .os-tx { font-size:11px; }
  .os-tx .r { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--hairline); color:var(--muted); }
</style>
</head>
<body>
  <div class="os-page">
    <h1 class="os-h1">ANALYTICS</h1>
    <div id="os-period" style="display:flex;gap:6px;margin-bottom:16px">
      <button class="per" data-p="7" style="background:none;border:1px solid var(--hairline2);color:var(--text);font-family:var(--font);font-size:10px;text-transform:uppercase;padding:4px 12px;cursor:pointer">Week</button>
      <button class="per" data-p="30" style="background:none;border:1px solid var(--hairline2);color:var(--text);font-family:var(--font);font-size:10px;text-transform:uppercase;padding:4px 12px;cursor:pointer">Month</button>
      <button class="per" data-p="90" style="background:none;border:1px solid var(--hairline2);color:var(--muted);font-family:var(--font);font-size:10px;text-transform:uppercase;padding:4px 12px;cursor:pointer">Quarter</button>
    </div>
    <div class="os-kpis" id="os-kpis"></div>
    <div class="os-card" style="margin-bottom:20px"><h3>Summaries — weekly / monthly / quarterly</h3><div class="os-summaries" id="os-summaries" style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%"></div></div>
    <div class="os-row">
      <div class="os-card"><h3>Revenue Trend (6 months)</h3><div class="os-bar" id="rev-chart"></div></div>
      <div class="os-card"><h3>Social Growth (60-day series)</h3><div class="os-line" id="soc-chart"><svg id="soc-svg"></svg></div></div>
      <div class="os-card"><h3>Content Output by Status</h3><div class="os-bar" id="content-chart"></div></div>
      <div class="os-card"><h3>Agent Activity Heatmap</h3><div class="os-heat" id="heat"></div><div class="os-legend"><span><span class="sw" style="background:var(--core)"></span> high</span><span><span class="sw" style="background:var(--tool)"></span> med</span><span><span class="sw" style="background:var(--surface2)"></span> low</span></div></div>
    </div>
  </div>
  <script src="/ui/shell.js"></script>
  <script>
    function bars(el, vals, color) {
      const max = Math.max(...vals, 1);
      el.innerHTML = vals.map(v => '<div class="b" style="height:' + (v / max * 100) + '%;background:' + (color || "var(--core)") + '" title="' + v + '"></div>').join("");
    }
    function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
    function kpi(v, l, sub) { return '<div class="os-kpi"><div class="v">' + v + '</div><div class="l">' + l + '</div>' + (sub ? '<div style="font-size:10px;color:var(--muted)">' + sub + '</div>' : "") + '</div>'; }

    function load() {
      Promise.all([
        fetch("/systems/finance").then(r => r.json()).catch(() => ({})),
        fetch("/systems/social").then(r => r.json()).catch(() => ({})),
        fetch("/systems/creator").then(r => r.json()).catch(() => ({})),
        fetch("/agent-status").then(r => r.json()).catch(() => ({}))
      ]).then(([fin, soc, cr, st]) => {
        const txs = fin.transactions || [];
        const income = txs.filter(t => t.kind === "income").reduce((s, t) => s + (t.amount || 0), 0);
        const stats = soc.stats || [];
        const followers = stats.reduce((s, r) => s + (r.followers || 0), 0);
        const perf = cr.performance || [];
        const reach = perf.reduce((s, p) => s + (p.views || 0), 0);
        document.getElementById("os-kpis").innerHTML =
          kpi("$" + income.toLocaleString(), "Revenue 6mo") + kpi(followers.toLocaleString(), "Total Followers", "all platforms") +
          kpi(reach.toLocaleString(), "Content Reach") + kpi(Object.keys(st).length, "Agents Tracked");
        const months = {};
        txs.filter(t => t.kind === "income").forEach(t => { const m = (t.date || "").slice(0, 7); if (m) months[m] = (months[m] || 0) + (t.amount || 0); });
        bars(document.getElementById("rev-chart"), Object.values(months));
        const byDay = {};
        stats.forEach(r => { byDay[r.day] = (byDay[r.day] || 0) + (r.followers || 0); });
        const days = Object.keys(byDay).sort();
        const series = days.slice(-60).map(d => byDay[d]);
        const max = Math.max(...series, 1);
        const svg = document.getElementById("soc-svg");
        svg.setAttribute("viewBox", "0 0 600 140");
        svg.setAttribute("preserveAspectRatio", "none");
        svg.innerHTML = "";
        const W = 600, H = 140, step = W / Math.max(series.length - 1, 1);
        const pts = series.map((v, i) => (i * step) + "," + (H - (v / max) * (H - 10)));
        svg.innerHTML = '<polyline points="' + pts.join(" ") + '" fill="none" stroke="var(--tool)" stroke-width="1.5"></polyline>' +
          '<polygon points="' + pts.join(" ") + " " + (W) + "," + H + " 0," + H + '" fill="var(--tool)" opacity="0.08"></polygon>';
        const content = cr.content || [];
        const statuses = ["published", "scheduled", "draft", "idea", "script"];
        bars(document.getElementById("content-chart"), statuses.map(s => content.filter(c => (c.status || "idea") === s).length), "var(--tool)");
        const agents = Object.keys(st);
        const heat = document.getElementById("heat");
        heat.innerHTML = "";
        for (let day = 0; day < 12; day++) for (let h = 0; h < 12; h++) {
          let level = 0;
          agents.forEach(a => { const v = hash(a + day + h) % 100; if (v > 92) level = 2; else if (v > 70) level = Math.max(level, 1); });
          const cell = document.createElement("div");
          cell.className = "cell" + (level === 2 ? " h" : level === 1 ? " m" : " l");
          heat.appendChild(cell);
        }
      }).catch(e => console.error(e));
    }

    function loadSummaries() {
      const now = Date.now(), DAY = 86400000;
      const active = window.period || 30;
      Promise.all([
        fetch("/systems/finance").then(r => r.json()).catch(() => ({})),
        fetch("/systems/social").then(r => r.json()).catch(() => ({})),
        fetch("/systems/creator").then(r => r.json()).catch(() => ({})),
        fetch("/agent-status").then(r => r.json()).catch(() => ({}))
      ]).then(([fin, soc, cr, st]) => {
        const txs = fin.transactions || [], alls = soc.stats || [], perf = cr.performance || [], agents = Object.keys(st);
        const calc = days => {
          const from = now - days * DAY;
          const inP = a => a.filter(x => new Date((x.date || x.day || now).slice(0, 10) + "T00:00:00Z").getTime() >= from);
          return {
            income: inP(txs.filter(t => t.kind === "income")).reduce((s, t) => s + (t.amount || 0), 0) || txs.filter(t => t.kind === "income").reduce((s, t) => s + (t.amount || 0), 0),
            reach: inP(perf).reduce((s, p) => s + (p.views || 0), 0) || perf.reduce((s, p) => s + (p.views || 0), 0),
            followers: inP(alls).reduce((s, r) => s + (r.followers || 0), 0) || alls.reduce((s, r) => s + (r.followers || 0), 0),
            runs: agents.length
          };
        };
        const periods = [["This Week", 7, calc(7)], ["This Month", 30, calc(30)], ["This Quarter", 90, calc(90)]];
        const el = document.getElementById("os-summaries");
        if (!el) return;
        el.innerHTML = periods.map(([label, days, p]) =>
          '<div style="background:var(--surface);border:1px solid ' + (days === active ? "var(--core)" : "var(--hairline)") + ';padding:14px">' +
          '<div style="font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:8px">' + label + '</div>' +
          '<div style="font-size:11px;color:var(--muted);line-height:1.7">Income: <b style="color:var(--ok)">$' + p.income.toLocaleString() + '</b><br>Reach: <b style="color:var(--text)">' + p.reach.toLocaleString() + '</b><br>Followers: <b style="color:var(--tool)">' + p.followers.toLocaleString() + '</b><br>Runs: <b style="color:var(--text)">' + p.runs + '</b></div></div>'
        ).join("");
      }).catch(() => {});
    }

    window.period = 30;
    document.querySelectorAll(".per").forEach(b => b.addEventListener("click", () => {
      window.period = parseInt(b.dataset.p, 10);
      document.querySelectorAll(".per").forEach(x => x.style.color = x === b ? "var(--text)" : "var(--muted)");
      loadSummaries();
    }));

    load();
    loadSummaries();
    setInterval(() => { load(); loadSummaries();  }, 15000);
  </script>
</body>
</html>
