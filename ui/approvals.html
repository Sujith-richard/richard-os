<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richard OS — Approvals</title>
<script>window.PAGE = { title: "Approvals", crumb: ["Operate", "Approvals"] };</script>
<style>
  .os-app { max-width:820px; }
  .os-approval { background:var(--surface); border:1px solid var(--hairline); padding:14px; margin-bottom:10px; }
  .os-approval .h { display:flex; justify-content:space-between; align-items:center; }
  .os-approval .a { font-size:12px; font-weight:700; }
  .os-approval .act { font-size:10px; color:var(--core); letter-spacing:.1em; text-transform:uppercase; }
  .os-approval .when { font-size:10px; color:var(--dim); }
  .os-approval pre { font-size:10px; color:var(--muted); background:var(--surface2); padding:8px; margin:8px 0; white-space:pre-wrap; word-break:break-word; max-height:140px; overflow-y:auto; }
  .os-approval .btns { display:flex; gap:8px; }
  .os-approval button { font-family:var(--font); font-size:11px; padding:6px 14px; cursor:pointer; border:1px solid var(--hairline2); background:none; color:var(--text); }
  .os-approval .ok { border-color:var(--ok); color:var(--ok); }
  .os-approval .ok:hover { background:rgba(47,211,111,.12); }
  .os-approval .no { border-color:var(--err); color:var(--err); }
  .os-approval .no:hover { background:rgba(255,45,63,.12); }
  .os-empty { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
  <div class="os-page">
    <h1 class="os-h1">APPROVAL QUEUE</h1>
    <div id="os-count" style="font-size:11px;color:var(--muted);margin-bottom:16px"></div>
    <div class="os-app" id="os-app"></div>
  </div>
  <script src="/ui/shell.js"></script>
  <script>
    function load() {
      fetch("/approvals").then(r => r.json()).then(d => {
        const list = d.pending || [];
        document.getElementById("os-count").textContent = list.length + " pending draft" + (list.length === 1 ? "" : "s") + " — agents act, you approve";
        const el = document.getElementById("os-app");
        el.innerHTML = "";
        if (!list.length) { el.innerHTML = '<div class="os-empty">(empty — nothing waiting for your approval)</div>'; return; }
        list.forEach(a => {
          let payload = "—";
          try { payload = JSON.stringify(JSON.parse(a.payload), null, 2); } catch(e) {}
          const c = document.createElement("div");
          c.className = "os-approval";
          c.innerHTML =
            '<div class="h"><span class="a">' + a.agent + '</span><span class="act">' + a.action + '</span><span class="when">' + a.created_at + '</span></div>' +
            '<pre>' + payload + '</pre>' +
            '<div class="btns"><button class="ok" data-i="' + a.id + '">APPROVE</button><button class="no" data-i="' + a.id + '">REJECT</button></div>';
          c.querySelector(".ok").addEventListener("click", () => send(a.id, "approve"));
          c.querySelector(".no").addEventListener("click", () => send(a.id, "reject"));
          el.appendChild(c);
        });
      }).catch(e => { document.getElementById("os-app").innerHTML = '<div class="os-empty">error: ' + e + '</div>'; });
    }
    function send(id, action) {
      fetch("/approvals/" + id + "/" + action, { method: "POST" }).then(r => r.json()).then(() => load()).catch(e => alert(e));
    }
    load();
    setInterval(load, 8000);
  </script>
</body>
</html>
