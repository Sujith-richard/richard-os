<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richard OS — AI Core</title>
<script>window.PAGE = { title: "AI Core", crumb: ["Operate", "AI Core"] };</script>
<style>
  .os-chat { display:flex; flex-direction:column; height:calc(100vh - 160px); max-width:820px; margin:0 auto; }
  .os-msgs { flex:1; overflow-y:auto; padding:16px 8px; display:flex; flex-direction:column; gap:10px; }
  .os-bubble { max-width:78%; padding:10px 14px; border-radius:14px; font-size:13px; line-height:1.55; white-space:pre-wrap; }
  .os-bubble.user { align-self:flex-end; background:var(--surface2); border:1px solid var(--hairline2); border-bottom-right-radius:4px; color:var(--text); }
  .os-bubble.ai { align-self:flex-start; background:var(--surface); border:1px solid var(--hairline); border-bottom-left-radius:4px; color:var(--muted); }
  .os-bubble .ts { display:block; font-size:9px; color:var(--dim); margin-top:6px; text-align:right; }
  .os-bubble.ai .owner { display:block; font-size:9px; color:var(--core); text-transform:uppercase; letter-spacing:.1em; margin-bottom:4px; }
  .os-typing { align-self:flex-start; color:var(--dim); font-size:12px; padding:6px 4px; }
  .os-chips { display:flex; gap:8px; flex-wrap:wrap; padding:8px 4px; }
  .os-chip { background:none; border:1px solid var(--hairline2); color:var(--muted); font-family:var(--font); font-size:11px; padding:6px 12px; border-radius:16px; cursor:pointer; }
  .os-chip:hover { color:var(--text); border-color:var(--tool); }
  .os-inputrow { display:flex; gap:10px; align-items:center; padding:12px 4px; border-top:1px solid var(--hairline); }
  .os-inputrow input { flex:1; background:var(--surface); border:1px solid var(--hairline2); border-radius:20px; padding:12px 16px; font-size:13px; color:var(--text); font-family:var(--font); outline:none; }
  .os-inputrow input:focus { border-color:var(--tool); }
  .os-send { background:none; border:1px solid var(--tool); color:var(--tool); font-family:var(--font); font-size:12px; padding:10px 18px; border-radius:20px; cursor:pointer; }
  .os-send:hover { background:rgba(41,215,246,.12); }
  .os-dl { display:inline-block; margin-top:8px; background:none; border:1px solid var(--ok); color:var(--ok); font-family:var(--font); font-size:11px; padding:6px 14px; border-radius:8px; text-decoration:none; }
  .os-dl:hover { background:rgba(47,211,111,.12); }
</style>
</head>
<body>
<div class="os-page">
<h1 class="os-h1">AI CORE · CHAT</h1>
<div class="os-chat">
  <div class="os-chips">
    <button class="os-chip">what's my morning brief?</button>
    <button class="os-chip">check the pipeline</button>
    <button class="os-chip">any pending approvals?</button>
    <button class="os-chip">run the agents</button>
    <button class="os-chip">open tasks</button>
  </div>
  <div class="os-msgs" id="os-msgs"></div>
  <div class="os-inputrow">
    <input id="os-in" placeholder="Chat with your AI core..." autocomplete="off" />
    <button class="os-send" id="os-send">Send</button>
  </div>
</div>
</div>
<script src="/ui/shell.js"></script>
<script>
const msgs = document.getElementById("os-msgs");
const input = document.getElementById("os-in");
const send = document.getElementById("os-send");

function ts() {
  const d = new Date();
  return d.getHours().toString().padStart(2, "0") + ":" + d.getMinutes().toString().padStart(2, "0");
}
function addBubble(role, text, owner) {
  const b = document.createElement("div");
  b.className = "os-bubble " + role;
  b.innerHTML = (role === "ai" && owner ? '<span class="owner">● ' + owner + '</span>' : "") +
    escapeHtml(text) + '<span class="ts">' + ts() + '</span>';
  msgs.appendChild(b);
  msgs.scrollTop = msgs.scrollHeight;
  return b;
}
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
}
function ask(text) {
  if (!text.trim()) return;
  addBubble("user", text);
  input.value = "";
  const typing = document.createElement("div");
  typing.className = "os-typing";
  typing.textContent = "● ● ●";
  msgs.appendChild(typing);
  msgs.scrollTop = msgs.scrollHeight;
  fetch("/chat?msg=" + encodeURIComponent(text), { method: "POST" })
    .then(r => r.json())
    .then(d => {
      typing.remove();
      const b = addBubble("ai", d.reply || "(no reply)", d.owner || "orchestrator");
      if (d.zip_url) {
        const a = document.createElement("a");
        a.className = "os-dl";
        a.href = d.zip_url;
        a.textContent = "📦 Download all as ZIP";
        a.setAttribute("download", "");
        b.appendChild(a);
      }
      if (d.html_url) {
        const a = document.createElement("a");
        a.className = "os-dl";
        a.href = d.html_url;
        a.textContent = "⬇ Download HTML report";
        a.setAttribute("download", "");
        b.appendChild(a);
      } else if (d.report_url) {
        const a = document.createElement("a");
        a.className = "os-dl";
        a.href = d.report_url;
        a.textContent = "⬇ Download report";
        a.setAttribute("download", "");
        b.appendChild(a);
      }
    })
    .catch(e => { typing.remove(); addBubble("ai", "error: " + e); });
}
send.addEventListener("click", () => ask(input.value));
input.addEventListener("keydown", e => { if (e.key === "Enter") ask(input.value); });
document.querySelectorAll(".os-chip").forEach(c => c.addEventListener("click", () => ask(c.textContent)));

// load past conversation
fetch("/chat/history").then(r => r.json()).then(d => {
  (d.messages || []).forEach(m => addBubble(m.role === "user" ? "user" : "ai", m.text, m.role === "ai" ? "core" : null));
});
</script>
</body>
</html>
