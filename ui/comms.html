<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richard OS — Communications</title>
<script>window.PAGE = { title: "Communications", crumb: ["System", "Communications"] };</script>
<style>
  .os-tabs { display:flex; gap:4px; border-bottom:1px solid var(--hairline); margin-bottom:16px; }
  .os-tab { background:none; border:none; color:var(--muted); font-family:var(--font); font-size:11px; letter-spacing:.1em; text-transform:uppercase; padding:10px 14px; cursor:pointer; border-bottom:2px solid transparent; }
  .os-tab.active { color:var(--text); border-bottom-color:var(--core); }
  .os-conv { background:var(--surface); border:1px solid var(--hairline); padding:14px; margin-bottom:10px; }
  .os-conv .h { display:flex; justify-content:space-between; align-items:center; }
  .os-conv .c { font-size:13px; font-weight:700; }
  .os-conv .s { font-size:9px; letter-spacing:.15em; text-transform:uppercase; padding:2px 8px; border:1px solid var(--hairline2); }
  .os-conv .s.pos { color:var(--ok); border-color:var(--ok); }
  .os-conv .s.neu { color:var(--warn); border-color:var(--warn); }
  .os-conv .s.neg { color:var(--err); border-color:var(--err); }
  .os-conv .subj { font-size:12px; color:var(--muted); margin:6px 0 2px; }
  .os-conv .body { font-size:11px; color:var(--dim); }
  .os-conv .meta { font-size:10px; color:var(--muted); display:flex; gap:14px; margin-top:8px; flex-wrap:wrap; }
  .os-conv .reply { font-size:10px; color:var(--tool); border-top:1px dashed var(--hairline2); margin-top:8px; padding-top:8px; }
  .os-empty { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
  <div class="os-page">
    <h1 class="os-h1">COMMUNICATIONS</h1>
    <div class="os-tabs" id="os-tabs"></div>
    <div id="os-list"></div>
  </div>
  <script src="/ui/shell.js"></script>
  <script>
    const CHANNELS = ["email", "linkedin", "x", "whatsapp", "slack", "discord", "calls", "all"];
    let current = "all";
    function load() {
      fetch("/systems/comms").then(r => r.json()).then(d => {
        const convs = d.conversations || [];
        const tabs = document.getElementById("os-tabs");
        tabs.innerHTML = CHANNELS.map(ch => {
          const count = ch === "all" ? convs.length : convs.filter(c => c.channel === ch).length;
          return '<button class="os-tab ' + (ch === current ? "active" : "") + '" data-ch="' + ch + '">' + ch + ' (' + count + ')</button>';
        }).join("");
        tabs.querySelectorAll(".os-tab").forEach(b => b.addEventListener("click", () => {
          current = b.dataset.ch;
          load();
        }));
        const shown = current === "all" ? convs : convs.filter(c => c.channel === current);
        document.getElementById("os-list").innerHTML = shown.slice(0, 50).map(c =>
          '<div class="os-conv">' +
          '<div class="h"><span class="c">' + c.contact + '</span><span class="s ' + c.sentiment + '">' + c.sentiment + '</span></div>' +
          '<div class="subj">' + c.subject + '</div>' +
          '<div class="body">' + c.body + '</div>' +
          '<div class="meta"><span>AI: ' + c.summary + '</span><span>follow-up: ' + c.follow_up + '</span><span>' + c.ts + '</span></div>' +
          '<div class="reply">suggested: ' + c.suggested_reply + '</div>' +
          '</div>'
        ).join("") || '<div class="os-empty">no conversations</div>';
      }).catch(e => { document.getElementById("os-list").innerHTML = '<div class="os-empty">error: ' + e + '</div>'; });
    }
    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
