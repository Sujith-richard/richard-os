<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richard OS — Finance</title>
<script>window.PAGE = { title: "Finance", crumb: ["System", "Finance"] };</script>
<style>
  .os-kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .os-kpi { background:var(--surface); border:1px solid var(--hairline); padding:14px; }
  .os-kpi .v { font-size:20px; font-weight:700; }
  .os-kpi .l { font-size:9px; letter-spacing:.15em; text-transform:uppercase; color:var(--dim); margin-top:3px; }
  .os-kpi .sub { font-size:10px; color:var(--muted); margin-top:2px; }
  .os-chart { display:flex; align-items:flex-end; gap:8px; height:120px; margin-bottom:20px; }
  .os-chart .b { flex:1; background:var(--core); opacity:.85; min-height:2px; }
  .os-chart .b.exp { background:var(--err); opacity:.7; }
  .os-accounts { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:20px; }
  .os-acc { background:var(--surface); border:1px solid var(--hairline); padding:12px; }
  .os-acc .n { font-size:12px; }
  .os-acc .b { font-size:17px; font-weight:700; margin-top:3px; }
  .os-acc .t { font-size:9px; color:var(--dim); text-transform:uppercase; letter-spacing:.15em; }
  .os-tx { font-size:11px; }
  .os-tx .r { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--hairline); color:var(--muted); }
  .os-tx .r .inc { color:var(--ok); }
  .os-tx .r .exp { color:var(--err); }
  .os-tx .r .d { color:var(--dim); font-size:10px; }
</style>
</head>
<body>
  <div class="os-page">
    <h1 class="os-h1">FINANCE</h1>
    <div class="os-kpis" id="os-kpis"></div>
    <div class="os-card"><h3>Cash Flow (6 months) <span style="color:var(--core)">■ income</span> <span style="color:var(--err)">■ expense</span></h3><div class="os-chart" id="os-cash"></div></div>
    <h3 class="os-h1" style="font-size:12px">ACCOUNTS</h3>
    <div class="os-accounts" id="os-accounts"></div>
    <h3 class="os-h1" style="font-size:12px">TRANSACTIONS</h3>
    <div class="os-tx" id="os-tx"></div>
    <h3 class="os-h1" style="font-size:12px">INVOICES</h3><div class="os-tx" id="os-inv"></div>
    <h3 class="os-h1" style="font-size:12px">SUBSCRIPTIONS</h3><div class="os-tx" id="os-subs"></div>
    <h3 class="os-h1" style="font-size:12px">UPCOMING BILLS</h3><div class="os-tx" id="os-bills"></div>
    <h3 class="os-h1" style="font-size:12px">EXPENSE CATEGORIES</h3><div class="os-tx" id="os-cats"></div>
  </div>
  <script src="/ui/shell.js"></script>
  <script>
    function load() {
      fetch("/systems/finance").then(r => r.json()).then(d => {
        const accs = d.accounts || [], txs = d.transactions || [];
        const income = txs.filter(t => t.kind === "income").reduce((s, t) => s + (t.amount || 0), 0);
        const expense = txs.filter(t => t.kind === "expense").reduce((s, t) => s + (t.amount || 0), 0);
        const balance = accs.reduce((s, a) => s + (a.balance || 0), 0);
        const mrr = Math.round(income / 3);                       // seeded 3 months
        const arr = mrr * 12;
        const runway = expense ? (balance / Math.max(expense / 3, 1)).toFixed(1) : "∞";
        document.getElementById("os-kpis").innerHTML =
          kpi("$" + mrr.toLocaleString(), "MRR", "~" + Math.round(income / 3) + "/mo") +
          kpi("$" + arr.toLocaleString(), "ARR", mrr + " × 12") +
          kpi(runway + " mo", "Runway", "at current burn") +
          kpi("$" + balance.toLocaleString(), "Total Cash", accs.length + " accounts") +
          kpi("$" + expense.toLocaleString(), "Expenses", "3 months") +
          kpi(txs.length, "Transactions", "seeded");
        // cash flow chart: income vs expense per month (group by date month)
        const months = {};
        txs.forEach(t => {
          const m = (t.date || "2026-08").slice(0, 7);
          if (!months[m]) months[m] = { inc: 0, exp: 0 };
          if (t.kind === "income") months[m].inc += (t.amount || 0);
          else months[m].exp += (t.amount || 0);
        });
        const keys = Object.keys(months).sort();
        const max = Math.max(...keys.map(k => Math.max(months[k].inc, months[k].exp)), 1);
        const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        document.getElementById("os-cash").innerHTML = keys.map(k => {
          const mi = months[k].inc / max * 100;
          const me = months[k].exp / max * 100;
          const label = MONTHS[parseInt(k.slice(5), 10) - 1] || k;
          return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px">' +
            '<div style="width:100%;display:flex;align-items:flex-end;gap:2px;height:120px">' +
            '<div class="b" style="height:' + mi + '%" title="' + k + ' income $' + months[k].inc + '"></div>' +
            '<div class="b exp" style="height:' + me + '%" title="' + k + ' expense $' + months[k].exp + '"></div>' +
            '</div><div style="font-size:9px;color:var(--dim)">' + label + '</div></div>';
        }).join("");
        // legend
        const chart = document.getElementById("os-cash");
        chart.style.marginBottom = "6px";
        document.getElementById("os-accounts").innerHTML = accs.map(a =>
          '<div class="os-acc"><div class="n">' + a.name + '</div><div class="b">$' + (a.balance || 0).toFixed(2) + '</div><div class="t">' + (a.type || "") + '</div></div>'
        ).join("");
        document.getElementById("os-tx").innerHTML = txs.slice().reverse().map(t =>
          '<div class="r"><span>' + (t.note || "") + ' <span class="d">' + (t.date || "") + '</span></span><span class="' + (t.kind === "income" ? "inc" : "exp") + '">' + (t.kind === "income" ? "+" : "-") + '$' + (t.amount || 0).toFixed(2) + '</span></div>'
        ).join("") || '<div style="color:var(--dim)">no transactions</div>';
        // ── invoices, subscriptions, bills, categories ──
        const inv = d.invoices || [];
        document.getElementById("os-inv").innerHTML = inv.map(i =>
          '<div class="r"><span>' + (i.client || "") + ' <span class="d">' + (i.status || "") + ' · due ' + (i.due || "") + '</span></span><span class="inc">$' + (i.amount || 0).toLocaleString() + '</span></div>'
        ).join("") || '<div style="color:var(--dim)">no invoices</div>';
        const subs = d.subscriptions || [];
        document.getElementById("os-subs").innerHTML = subs.map(s =>
          '<div class="r"><span>' + (s.name || "") + ' <span class="d">' + (s.cycle || "") + ' · ' + (s.next_bill || "") + '</span></span><span class="exp">$' + (s.cost || 0).toFixed(2) + '/mo</span></div>'
        ).join("") || '<div style="color:var(--dim)">no subscriptions</div>';
        const bills = d.bills || [];
        document.getElementById("os-bills").innerHTML = bills.map(b =>
          '<div class="r"><span>' + (b.name || "") + ' <span class="d">due ' + (b.due || "") + '</span></span><span class="exp">$' + (b.amount || 0).toFixed(2) + '</span></div>'
        ).join("") || '<div style="color:var(--dim)">no bills</div>';
        const cats = d.categories || [];
        document.getElementById("os-cats").innerHTML = cats.map(c =>
          '<div class="r"><span>' + (c.name || "") + '</span><span class="exp">$' + (c.amount || 0).toFixed(2) + '</span></div>'
        ).join("") || '<div style="color:var(--dim)">no categories</div>';
      }).catch(e => console.error(e));
    }
    function kpi(v, l, sub) { return '<div class="os-kpi"><div class="v">' + v + '</div><div class="l">' + l + '</div><div class="sub">' + sub + '</div></div>'; }
    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
