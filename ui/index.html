<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richard OS — Console</title>
<script>window.PAGE = { title: "Console", crumb: ["Operate", "Console"] };</script>
</head>
<body>
  <div class="os-page">
    <h1 class="os-h1">OPERATOR CONSOLE</h1>
    <div class="os-pulse">
      <div><div class="m" id="m-nodes">&ndash;</div><div class="l">Graph nodes</div></div>
      <div><div class="m" id="m-edges">&ndash;</div><div class="l">Edges</div></div>
      <div><div class="m" id="m-agents">&ndash;</div><div class="l">Agents</div></div>
      <div><div class="m" id="m-systems">&ndash;</div><div class="l">Systems</div></div>
    </div>
    <div class="os-row">
      <div class="os-card" style="flex:2;min-width:300px;cursor:pointer" onclick="location.href='/ui/brain.html'" title="Open interactive graph"><h3>Knowledge Core <span style="float:right;color:var(--dim)">OPEN BRAIN →</span></h3><div id="core-preview" style="height:280px"></div></div>
      <div class="os-card" style="flex:1;min-width:240px"><h3>Agent Roster</h3><div id="agent-list"></div></div>
    </div>
  </div>
  <script src="/ui/shell.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script>
    fetch("/graph").then(r => r.json()).then(d => {
      document.getElementById("m-nodes").textContent = d.nodes.length;
      document.getElementById("m-edges").textContent = d.edges.length;
      const doms = d.nodes.filter(n => n.type === "domain").length;
      const tools = d.nodes.filter(n => n.type === "tool").length;
      document.getElementById("m-agents").textContent = d.nodes.filter(n => n.type === "agent" || n.type === "employee").length;
      document.getElementById("m-systems").textContent = tools + " tools / " + doms + " domains";
      // mini radial: core + domains + systems
      const W = 480, H = 280, cx = W / 2, cy = H / 2;
      const svg = d3.select("#core-preview").append("svg").attr("width", W).attr("height", H);
      const core = d.nodes.find(n => n.type === "core");
      const ring1 = d.nodes.filter(n => n.type === "domain");
      const ring2 = d.nodes.filter(n => n.type === "tool" || n.type === "agent" || n.type === "dept").slice(0, 24);
      svg.append("circle").attr("cx", cx).attr("cy", cy).attr("r", 10).attr("fill", "var(--core)").style("filter", "drop-shadow(0 0 10px var(--core))");
      ring1.forEach((n, i) => {
        const a = (i / ring1.length) * 2 * Math.PI - Math.PI / 2, r = 60;
        svg.append("line").attr("x1", cx).attr("y1", cy).attr("x2", cx + Math.cos(a) * r).attr("y2", cy + Math.sin(a) * r).attr("stroke", "var(--hairline2)");
        svg.append("circle").attr("cx", cx + Math.cos(a) * r).attr("cy", cy + Math.sin(a) * r).attr("r", 6).attr("fill", n.color || "var(--muted)");
        svg.append("text").attr("x", cx + Math.cos(a) * (r + 18)).attr("y", cy + Math.sin(a) * (r + 18) + 4).attr("fill", "var(--muted)").attr("font-size", 10).attr("text-anchor", "middle").text(n.label);
      });
      ring2.forEach((n, i) => {
        const a = (i / Math.max(ring2.length, 1)) * 2 * Math.PI + 0.3, r = 100;
        svg.append("circle").attr("cx", cx + Math.cos(a) * r).attr("cy", cy + Math.sin(a) * r).attr("r", 3).attr("fill", n.color || "var(--dim)");
      });
    });
    fetch("/agent-status").then(r => r.json()).then(st => {
      const list = Object.entries(st).sort((a, b) => (b[1].last_run || "").localeCompare(a[1].last_run || ""));
      document.getElementById("agent-list").innerHTML = list.slice(0, 12).map(([name, info]) =>
        '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--hairline);font-size:12px">' +
        '<span><span style="color:var(--ok)">\u25CF</span> ' + name + '</span>' +
        '<span style="color:var(--dim)">' + (info.action || "idle") + '</span></div>'
      ).join("") || '<div style="color:var(--dim);font-size:12px">no agents yet</div>';
    });
  </script>
</body>
</html>
