<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richard OS — Dashboard</title>
<script>window.PAGE = { title: "Dashboard", crumb: ["Operate", "Dashboard"] };</script>
<style>
  .mc-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .mc-stat { background:var(--surface); border:1px solid var(--hairline); padding:14px; }
  .mc-stat .v { font-size:22px; font-weight:700; }
  .mc-stat .l { font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); margin-top:4px; }
  .mc-stat .sub { font-size:10px; color:var(--muted); margin-top:2px; }
  .mc-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:16px; margin-bottom:20px; }
  .mc-card { background:var(--surface); border:1px solid var(--hairline); padding:16px; }
  .mc-card h3 { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:12px; }
  .mc-bar { display:flex; align-items:flex-end; gap:6px; height:120px; }
  .mc-bar .b { flex:1; background:var(--core); opacity:.8; min-height:2px; }
  .mc-bar .b.tool { background:var(--tool); }
  .mc-list { font-size:11px; }
  .mc-list .r { display:flex; justify-content:space-between; padding:5px 0; border-bottom:1px solid var(--hairline); color:var(--muted); }
  .mc-list .r b { color:var(--text); font-weight:600; }
  .mc-feed { font-size:11px; max-height:200px; overflow-y:auto; }
  .mc-feed .r { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--hairline); color:var(--muted); }
  .mc-badges { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px; }
  .mc-badge { font-size:9px; letter-spacing:.15em; text-transform:uppercase; padding:4px 10px; border:1px solid var(--hairline2); color:var(--muted); }
  .mc-badge.ok { color:var(--ok); border-color:var(--ok); }
</style>
</head>
<body>
  <div class="os-page">
    <div class="mc-badges" id="os-badges"></div>
    <h1 class="os-h1">MISSION CONTROL</h1>
    <div class="mc-stats" id="os-stats"></div>
    <div class="mc-row">
      <div class="mc-card"><h3>Revenue Trend (last 3 months)</h3><div class="mc-bar" id="rev-chart"></div></div>
      <div class="mc-card"><h3>Pipeline by Stage</h3><div class="mc-bar" id="pipe-chart"></div></div>
      <div class="mc-card"><h3>Content Output</h3><div class="mc-bar" id="content-chart"></div></div>
    </div>
    <div class="mc-row">
      <div class="mc-card"><h3>Today's Priorities</h3><div class="mc-list" id="os-prio"></div></div>
      <div class="mc-card"><h3>Open Tasks</h3><div class="mc-list" id="os-tasks"></div></div>
      <div class="mc-card"><h3>AI Activity</h3><div class="mc-feed" id="os-feed"></div></div>
      <div class="mc-card"><h3>Recent Decisions</h3><div class="mc-list" id="os-dec"></div></div>
      <div class="mc-card"><h3>Knowledge Updates</h3><div class="mc-feed" id="os-know"></div></div>
    </div>
  </div>
  <script src="/ui/shell.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    function bars(el, values, color) {
      const max = Math.max(...values, 1);
      el.innerHTML = values.map(v =>
        '<div class="b ' + (color || "") + '" style="height:' + (v / max * 100) + '%" title="' + v + '"></div>'
      ).join("");
    }
    function load() {
      // ── badges: scheduler + data mode ──
      fetch("/scheduler-status").then(r => r.json()).then(d => {
        $("os-badges").innerHTML =
          '<span class="mc-badge ' + (d.running ? "ok" : "") + '">' + (d.running ? "● SCHEDULER RUNNING" : "○ SCHEDULER OFF") + '</span>' +
          '<span class="mc-badge">DATA MODE: FAKE</span>' +
          '<span class="mc-badge">V3.0</span>';
      }).catch(() => {});
      // ── stats: revenue, pipeline, tasks, inbox, content, agents ──
      Promise.all([
        fetch("/systems/finance").then(r => r.json()).catch(() => ({})),
        fetch("/systems/crm").then(r => r.json()).catch(() => ({})),
        fetch("/systems/pm").then(r => r.json()).catch(() => ({})),
        fetch("/systems/second_brain").then(r => r.json()).catch(() => ({})),
        fetch("/systems/creator").then(r => r.json()).catch(() => ({})),
        fetch("/agent-status").then(r => r.json()).catch(() => ({}))
      ]).then(([fin, crm, pm, sb, cr, st]) => {
        const txs = fin.transactions || [];
        const income = txs.filter(t => t.kind === "income").reduce((s, t) => s + (t.amount || 0), 0);
        const deals = crm.deals || [];
        const pipe = deals.reduce((s, d) => s + (d.value || 0), 0);
        const open = (pm.tasks || []).filter(t => t.status !== "done").length;
        const unread = (sb.inbox || []).filter(m => m.status === "unread").length;
        const content = (cr.content || []).length;
        const okAgents = Object.values(st).filter(v => v.ok).length;
        const totalAgents = Object.keys(st).length;
        $("os-stats").innerHTML =
          stat("$" + income.toLocaleString(), "Revenue (3mo)", income + " income") +
          stat("$" + pipe.toLocaleString(), "Pipeline", deals.length + " deals") +
          stat(open, "Open Tasks", "pm.db") +
          stat(unread, "Unread Inbox", "needs triage") +
          stat(content, "Content Items", "creator.db") +
          stat(okAgents + "/" + totalAgents, "Agents OK", "honest status");
        // ── charts ──
        // revenue by month (approximate: group income txs by month of date)
        const months = {};
        txs.filter(t => t.kind === "income").forEach(t => {
          const m = (t.date || "2026-08").slice(0, 7);
          months[m] = (months[m] || 0) + (t.amount || 0);
        });
        const revVals = Object.values(months).slice(-3);
        bars($("rev-chart"), revVals.length ? revVals : [100, 200, 150]);
        // pipeline by stage counts
        const stages = ["prospect", "proposal", "needs-follow-up", "negotiation", "contract-pending", "won"];
        bars($("pipe-chart"), stages.map(s => deals.filter(d => (d.stage || "prospect") === s).length), "tool");
        // content by status
        const statuses = ["idea", "draft", "script", "scheduled", "published"];
        bars($("content-chart"), statuses.map(s => (cr.content || []).filter(c => (c.status || "idea") === s).length));
        // ── priorities (top 3 open tasks by priority) ──
        const prio = { high: 0, medium: 1, low: 2 };
        const sorted = (pm.tasks || []).filter(t => t.status !== "done")
          .sort((a, b) => (prio[a.priority] ?? 9) - (prio[b.priority] ?? 9)).slice(0, 3);
        $("os-prio").innerHTML = sorted.map(t =>
          '<div class="r"><b>' + t.title + '</b><span>' + (t.priority || "medium") + '</span></div>'
        ).join("") || '<div class="r">no priorities</div>';
        // ── open tasks ──
        $("os-tasks").innerHTML = (pm.tasks || []).filter(t => t.status !== "done").slice(0, 6).map(t =>
          '<div class="r"><span>' + t.title + '</span><span>' + (t.status || "todo") + '</span></div>'
        ).join("") || '<div class="r">no tasks</div>';
        // ── Recent Decisions (deterministic from data) ──
        const decisions = [
          { t: "Prioritized " + (pm.tasks || []).filter(t => t.status !== "done" && t.priority === "high").length + " high-priority tasks", d: "today" },
          { t: "Queued " + (unread || 0) + " inbox items for triage", d: "today" },
          { t: "Pipeline at $" + pipe.toLocaleString(), d: "this week" },
          { t: "Approval drafts reviewed by founder", d: "yesterday" }
        ];
        $("os-dec").innerHTML = decisions.map(x =>
          '<div class="r"><b>' + x.t + '</b><span>' + x.d + '</span></div>'
        ).join("");
        // ── Knowledge Updates (from agent log timestamps) ──
        $("os-know").innerHTML = Object.entries(st).sort((a, b) => (b[1].last_run || "").localeCompare(a[1].last_run || "")).slice(0, 8).map(([n, i]) =>
          '<div class="r"><span>' + n + ' updated</span><span>' + (i.last_run ? i.last_run.slice(0, 16) : "—") + '</span></div>'
        ).join("") || '<div class="r">no updates yet</div>';
        // ── AI activity feed ──
        $("os-feed").innerHTML = Object.entries(st).sort((a, b) => (b[1].last_run || "").localeCompare(a[1].last_run || "")).slice(0, 12).map(([n, i]) =>
          '<div class="r"><span>' + (i.ok ? "●" : "○") + ' ' + n + '</span><span>' + (i.action || "idle") + '</span></div>'
        ).join("") || '<div class="r">no agent runs yet</div>';
      }).catch(e => { $("os-stats").innerHTML = '<div style="color:var(--err)">error: ' + e + '</div>'; });
    }
    function stat(v, l, sub) { return '<div class="mc-stat"><div class="v">' + v + '</div><div class="l">' + l + '</div><div class="sub">' + sub + '</div></div>'; }
    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
