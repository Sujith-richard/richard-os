<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Richard OS — Roadmap</title>
<script>window.PAGE={title:"Roadmap",crumb:["System","Roadmap"]};</script>
<style>
  .os-phase { margin-bottom:24px; }
  .os-phase h3 { font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
  .os-item { background:var(--surface); border:1px solid var(--hairline); padding:12px 14px; margin-bottom:8px; display:flex; align-items:center; gap:12px; }
  .os-item .grow { flex:1; min-width:0; }
  .os-item .t { font-size:12px; font-weight:600; }
  .os-item .d { font-size:10px; color:var(--dim); margin-top:2px; }
  .os-bar { height:6px; background:var(--surface2); border-radius:3px; margin-top:8px; overflow:hidden; }
  .os-bar .fill { height:100%; background:var(--core); }
  .os-vote { background:none; border:1px solid var(--hairline2); color:var(--muted); font-family:var(--font); font-size:11px; padding:4px 10px; cursor:pointer; flex-shrink:0; }
  .os-vote.on { color:var(--core); border-color:var(--core); }
  .os-vote:hover { background:var(--surface2); }
  .os-tag { font-size:9px; letter-spacing:.12em; text-transform:uppercase; padding:2px 8px; border:1px solid var(--hairline2); color:var(--muted); margin-left:8px; }
  .os-tag.done { color:var(--ok); border-color:var(--ok); }
</style>
</head>
<body>
<div class="os-page">
<h1 class="os-h1">ROADMAP</h1>
<div id="os-roadmap"></div>
</div>
<script src="/ui/shell.js"></script>
<script>
const PHASES = [
  { name: "Now", items: [
    { id: "rm-1", t: "Persona teams run for real", d: "Specialists with defined jobs + SOPs + schedules", pct: 100, done: true },
    { id: "rm-2", t: "Approval queue UI", d: "One-click approve/reject for autonomy-2 drafts", pct: 100, done: true },
    { id: "rm-3", t: "Backup & restore", d: "os export / os import, newest-snapshot auto-pick", pct: 100, done: true }
  ]},
  { name: "Next", items: [
    { id: "rm-4", t: "Real-data swap", d: "Gmail, GitHub, Home Assistant, MySQL — at the very end", pct: 0 },
    { id: "rm-5", t: "Semantic search", d: "lexical embedding stand-in on the Brain", pct: 100, done: true },
    { id: "rm-6", t: "deals-os forecast", d: "weighted pipeline by stage probability", pct: 100, done: true }
  ]},
  { name: "Later", items: [
    { id: "rm-7", t: "MySQL backend", d: "DB_ENGINE=mysql option behind SQLite default", pct: 10 },
    { id: "rm-8", t: "Mobile pass", d: "responsive pass for all pages", pct: 100, done: true },
    { id: "rm-9", t: "True multi-user auth", d: "beyond the single-operator token", pct: 0 }
  ]}
];
// votes persist in localStorage
const votes = JSON.parse(localStorage.getItem("richard-votes") || "{}");
function render() {
  document.getElementById("os-roadmap").innerHTML = PHASES.map(p =>
    '<div class="os-phase"><h3>' + p.name + ' <span>(' + p.items.length + ')</span></h3>' +
    p.items.map(it =>
      '<div class="os-item"><div class="grow"><div class="t">' + it.t + (it.done ? '<span class="os-tag done">done</span>' : '') + '</div>' +
      '<div class="d">' + it.d + '</div><div class="os-bar"><div class="fill" style="width:' + it.pct + '%"></div></div></div>' +
      '<button class="os-vote ' + (votes[it.id] ? "on" : "") + '" data-id="' + it.id + '">▲ ' + (votes[it.id] || 0) + '</button></div>'
    ).join("") + '</div>'
  ).join("");
  document.querySelectorAll(".os-vote").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.id;
    votes[id] = (votes[id] || 0) + 1;
    localStorage.setItem("richard-votes", JSON.stringify(votes));
    b.textContent = "▲ " + votes[id];
    b.classList.add("on");
  }));
}
render();
</script>
</body>
</html>
