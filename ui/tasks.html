<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richard OS — Tasks</title>
<script>window.PAGE = { title: "Tasks", crumb: ["Operate", "Tasks"] };</script>
<style>
  .os-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-bottom:20px; }
  .os-stat { background:var(--surface); border:1px solid var(--hairline); padding:12px; }
  .os-stat .v { font-size:18px; font-weight:700; }
  .os-stat .l { font-size:9px; letter-spacing:.15em; text-transform:uppercase; color:var(--dim); margin-top:3px; }
  .os-kanban { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
  .os-col { background:var(--surface); border:1px solid var(--hairline); padding:12px; }
  .os-col h3 { font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between; }
  .os-col h3 .n { color:var(--core); }
  .os-card2 { background:var(--surface2); border:1px solid var(--hairline); border-left:3px solid var(--dim); padding:10px; margin-bottom:8px; }
  .os-card2 .p { font-size:10px; color:var(--muted); display:flex; justify-content:space-between; margin-top:6px; }
  .os-card2 .p .pri { font-size:9px; letter-spacing:.1em; text-transform:uppercase; }
  .os-card2.pri-high   { border-left:4px solid #ef4444 !important; background:rgba(239,68,68,.12); }
  .os-card2.pri-medium { border-left:4px solid #f59e0b !important; background:rgba(245,158,11,.12); }
  .os-card2.pri-low    { border-left:4px solid #10b981 !important; background:rgba(16,185,129,.12); }
  .os-empty { color:var(--dim); font-size:11px; }
  .pri-high   { border-left: 5px solid #ef4444; }
  .pri-medium { border-left: 5px solid #f59e0b; }
  .pri-low    { border-left: 5px solid #10b981; }
  </style>
</head>
<body>
  <div class="os-page">
    <h1 class="os-h1">TASK BOARD</h1>
    <div class="os-stats" id="os-stats"></div>
    <div class="os-kanban" id="os-kanban"></div>
  </div>
  <script src="/ui/shell.js"></script>
  <script>
    const COLS = [["todo","To Do"],["in_progress","In Progress"],["done","Done"]];
    const PRIO = { high: "var(--err)", medium: "var(--warn)", low: "var(--dim)" };
    function load() {
      fetch("/systems/pm").then(r => r.json()).then(d => {
        const tasks = d.tasks || [];
        const open = tasks.filter(t => t.status !== "done").length;
        const high = tasks.filter(t => t.priority === "high" && t.status !== "done").length;
        const done = tasks.filter(t => t.status === "done").length;
        const projects = new Set(tasks.map(t => t.project)).size;
        document.getElementById("os-stats").innerHTML =
          stat(tasks.length, "Total") + stat(open, "Open") + stat(high, "High Priority") + stat(done, "Done") + stat(projects, "Projects");
        const kanban = document.getElementById("os-kanban");
        kanban.innerHTML = "";
        COLS.forEach(([key, label]) => {
          const col = document.createElement("div");
          col.className = "os-col";
          const items = tasks.filter(t => (t.status || "todo") === key);
          col.appendChild(header(label, items.length));
          items.forEach(t => {
            const c = document.createElement("div");
            c.className = "os-card2 pri-" + (t.priority || "low");
            const prio = t.priority || "low";
            c.innerHTML = '<div>' + (t.title || "") + '</div>' +
              '<div class="p"><span>' + (t.project || "") + '</span>' +
              '<span class="p" style="color:' + (PRIO[prio] || "var(--dim)") + '">' + prio + '</span></div>';
            col.appendChild(c);
          });
          if (!items.length) col.innerHTML += '<div class="os-empty">empty</div>';
          kanban.appendChild(col);
        });
      }).catch(e => console.error(e));
    }
    function header(label, n) { return '<h3>' + label + ' <span class="n">' + n + '</span></h3>'; }
    function stat(v, l) { return '<div class="os-stat"><div class="v">' + v + '</div><div class="l">' + l + '</div></div>'; }
    load();
    setInterval(load, 10000);
  </script>
</body>
</html>
