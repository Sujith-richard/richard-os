<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Richard Voice Engine</title>
<style>
  :root{--bg:#0A101F;--panel:#121A2E;--panel2:#0E1626;--line:#1E2A44;--text:#D7E0F5;--muted:#8B9AC0;--chrome:#22D3EE;--accent:#10B981}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
  header{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  header h1{font-size:18px;color:var(--chrome)} header .sub{font-size:11px;color:var(--muted)}
  .wrap{max-width:760px;margin:22px auto;padding:0 18px;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .card h2{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px}
  .row:last-child{border-bottom:none}
  .status{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
  .status.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .switch{width:48px;height:25px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);position:relative;cursor:pointer;flex:0 0 auto}
  .switch.on{background:linear-gradient(135deg,var(--accent),#0891B2)}
  .switch .knob{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .2s}
  .switch.on .knob{left:25px}
  input[type=text],select{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 9px;font-size:12px}
  input[type=range]{width:150px}
  .cmd{display:flex;gap:8px;margin-top:8px}
  .cmd input{flex:1}
  .cmd button{background:linear-gradient(135deg,#7C3AED,#0891B2);border:none;color:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;width:80px}
  pre{background:#0B1120;border:1px solid var(--line);border-radius:9px;padding:10px;font:12px ui-monospace,Menlo,monospace;color:var(--muted);white-space:pre-wrap;max-height:220px;overflow:auto;margin-top:10px}
  .sbtn{margin-top:12px;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 14px;cursor:pointer;font-size:12px}
</style></head><body>
<header><div><h1>🎙 Voice Engine</h1><div class="sub">wake word · local · device routing</div></div></header>
<div class="wrap">
  <div class="card"><h2>Master switch</h2>
    <div class="row"><span><span id="st" class="status"></span><span id="stTxt">off</span></span>
      <div class="switch" id="sw" onclick="toggle()"><span class="knob"></span></div>
    </div>
  </div>
  <div class="card"><h2>Settings</h2>
    <div class="row"><span>Wake word</span><input type="text" id="wake" value="hey richard"></div>
    <div class="row"><span>Sensitivity</span><input type="range" id="sens" min="0" max="1" step="0.1" value="0.5"></div>
    <div class="row"><span>Language</span><select id="lang"><option>en</option><option>hi</option><option>ta</option></select></div>
    <div class="row"><span>Voice reply</span><input type="checkbox" id="vreply" checked></div>
    <div class="row"><span>Target device</span><select id="tdev"><option>auto</option><option>computer</option><option>mobile</option><option>home</option></select></div>
    <div class="row"><span>Privacy mode</span><input type="checkbox" id="priv" checked></div>
    <div class="row"><span>Persona</span><select id="persona"><option>jarvis</option><option>professional</option><option>friendly</option><option>minimal</option></select></div>
    <div class="row"><span>Address</span><select id="address"><option>sir</option><option>boss</option><option>richard</option></select></div>
    <button class="statbtn sbtn" onclick="vsave()">Save settings</button>
  </div>
  <div class="card"><h2>Command</h2>
    <div class="cmd"><input id="cmd" placeholder='say: "hey richard turn on the bedroom light"'><button onclick="vrun()">Run</button></div>
    <pre id="log">ready.</pre>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
async function j(u,o){const r=await fetch(u,o);return r.json();}
let st={listening:false,settings:{}};
function paint(on){
  st.listening=!!on;
  document.getElementById('sw').className='switch'+(on?' on':'');
  document.getElementById('st').className='status'+(on?' on':'');
  document.getElementById('stTxt').textContent=on?'listening':'off';
}
async function load(){
  try{
    const s=await j('/api/v1/voice/status');
    st=s||st; paint(!!(s.listening));
    const o=s.settings||{};
    if($('wake'))$('wake').value=o.wake_word||'hey richard';
    if($('sens'))$('sens').value=o.sensitivity||0.5;
    if($('lang'))$('lang').value=o.language||'en';
    if($('vreply'))$('vreply').checked=!!o.voice_reply;
    if($('tdev'))$('tdev').value=o.target_device||'auto';
    if($('priv'))$('priv').checked=!!o.privacy_mode;
    if($('persona'))$('persona').value=o.persona||'jarvis';
    if($('address'))$('address').value=o.address||'sir';
  }catch(e){}
}
async function toggle(){
  const on=!st.listening;
  await j('/api/v1/voice/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({on})});
  load();
}
async function vsave(){
  await j('/api/v1/voice/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    wake_word:$('wake').value,sensitivity:parseFloat($('sens').value)||0.5,
    language:$('lang').value,voice_reply:$('vreply').checked,
    target_device:$('tdev').value,privacy_mode:$('priv').checked,persona:$('persona').value,address:$('address').value})});
  load();
}
async function vrun(){
  const t=$('cmd').value.trim(); if(!t) return;
  const r=await j('/api/v1/voice/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
  document.getElementById('log').textContent=(r.log||[]).join('\n');
  load();
}
load();
setInterval(load,2000);
</script>
<script src="/ui/shell.js"></script>
</body></html>
