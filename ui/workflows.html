<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richard OS — Workflows</title>
<script>window.PAGE = { title: "Workflows", crumb: ["Operate", "Workflows"] };</script>
<style>
  .os-wf { background:var(--surface); border:1px solid var(--hairline); padding:16px; margin-bottom:16px; }
  .os-wf h3 { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--text); margin-bottom:4px; }
  .os-wf .sub { font-size:10px; color:var(--dim); margin-bottom:14px; }
  .os-flow { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .os-step { background:var(--surface2); border:1px solid var(--hairline2); padding:10px 14px; font-size:11px; color:var(--muted); max-width:150px; }
  .os-step b { display:block; color:var(--text); font-size:11px; }
  .os-step .k { font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--core); }
  .os-arrow { color:var(--dim); font-size:12px; }
  .os-step.trigger { border-color:var(--warn); }
  .os-step.approve { border-color:var(--err); }
  .os-step.action { border-color:var(--ok); }
</style>
</head>
<body>
  <div class="os-page">
    <h1 class="os-h1">WORKFLOWS</h1>
    <div id="os-wf"></div>
  </div>
  <script src="/ui/shell.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let WORKFLOWS = [];

  async function load() {
    const d = await fetch("/api/v1/workflows").then(r => r.json());
    WORKFLOWS = d.workflows || [];
    render();
  }

  async function planGoal() {
    const goal = $("plan-input").value.trim();
    if (!goal) return;
    const d = await fetch("/api/v1/workflows/plan", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ goal })
    }).then(r => r.json());
    if (!d.ok) { $("plan-out").textContent = "error: " + (d.error || "?"); return; }
    const plan = d.plan;
    $("plan-out").innerHTML =
      '<div style="margin:6px 0;font-size:11px;color:var(--muted)">plan: <b style="color:var(--text)">' + plan.title + '</b> (' + plan.steps.length + ' steps)</div>' +
      plan.steps.map((st,i) => '<div class="os-step" style="display:inline-block;margin:2px">' +
        '<b>' + st.t + '</b><span class="k" style="display:block;color:var(--core)">' + st.k + '</span></div>' +
        (i < plan.steps.length-1 ? '<span class="os-arrow">→</span>' : '')).join("");
  }

  async function runWf(name, btn) {
    btn.disabled = true; btn.textContent = "running…";
    const d = await fetch("/api/v1/workflows/" + name + "/run", { method: "POST" }).then(r => r.json());
    btn.disabled = false; btn.textContent = "RUN";
    if (!d.ok) { alert(d.error || "run failed"); await load(); return; }
    const card = btn.closest(".os-wf");
    const logEl = card.querySelector(".wf-log");
    logEl.innerHTML = d.log.map(e =>
      '<div style="font-size:10px;padding:2px 0;border-bottom:1px solid var(--hairline)"><b style="color:' +
      (e.ok ? "var(--ok)" : "var(--err)") + '">[' + e.kind + ']</b> ' + e.title +
      ' <span style="color:var(--dim)">' + e.detail + '</span></div>').join("");
    await load();
  }

  function render() {
    $("os-wf").innerHTML = WORKFLOWS.map(w =>
      '<div class="os-wf"><h3>' + w.title + '</h3><div class="sub">' + (w.goal || "") + '</div>' +
      '<div style="display:flex;gap:10px;font-size:10px;color:var(--muted);margin-bottom:10px">' +
        'status: <b style="color:' + (w.status === "done" ? "var(--ok)" : w.status === "error" ? "var(--err)" : "var(--dim)") + '">' + w.status + '</b>' +
        '<span>runs: ' + w.runs + '</span><span>errors: ' + w.errors + '</span>' +
        '<button class="wf-run" data-name="' + w.name + '" style="background:none;border:1px solid var(--hairline2);color:var(--text);font:inherit;font-size:10px;padding:3px 10px;cursor:pointer;margin-left:auto">RUN</button>' +
      '</div>' +
      '<div class="os-flow">' + JSON.parse(w.steps).map((s,i) =>
        '<div class="os-step ' + s.k + '"><b>' + s.t + '</b>' + (s.info ? '<span style="font-size:9px;color:var(--dim)">' + s.info + '</span>' : '') + '</div>' +
        (i < JSON.parse(w.steps).length-1 ? '<span class="os-arrow">→</span>' : '')
      ).join("") + '</div>' +
      '<div class="wf-log" style="margin-top:10px;font-family:ui-monospace,monospace"></div></div>'
    ).join("");
  }

  document.addEventListener("click", e => {
    const run = e.target.closest ? e.target.closest(".wf-run") : null;
    if (run) { runWf(run.dataset.name, run); return; }
  });

  // planner bar
  const bar = document.createElement("div");
  bar.style.cssText = "margin-bottom:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--hairline);padding:10px 14px;";
  bar.innerHTML = '<b style="font-size:11px;letter-spacing:.1em;color:var(--text)">PLANNER AI</b>' +
    '<input id="plan-input" placeholder="Goal, e.g. Process a new job lead…" style="flex:1;min-width:220px;background:var(--surface2);border:1px solid var(--hairline2);color:var(--text);font:inherit;font-size:11px;padding:6px 10px;border-radius:4px"/>' +
    '<button id="plan-btn" style="background:var(--core);border:none;color:var(--bg);font:inherit;font-size:11px;font-weight:700;padding:6px 14px;cursor:pointer;border-radius:4px">Plan it</button>' +
    '<div id="plan-out" style="width:100%"></div>';
  document.querySelector(".os-page").insertBefore(bar, $("os-wf"));

  $("plan-btn").addEventListener("click", planGoal);
  $("plan-input").addEventListener("keydown", e => { if (e.key === "Enter") planGoal(); });

  load();
</script>

</body>
</html>
